<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Search Form Fixture</title></head>
<body>
  <form id="search-form" action="/search" method="GET" role="search">
    <label for="search-input">Search Documentation</label>
    <input type="search" id="search-input" name="query" placeholder="Enter keywords..." />
    <button id="search-btn" type="submit" class="btn-search">Search</button>
  </form>
</body>
</html>
